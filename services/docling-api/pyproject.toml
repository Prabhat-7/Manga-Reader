[project]
name = "docling-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "docling>=2.66.0",
    "fastapi[standard]>=0.128.0",
    "python-dotenv>=1.2.1",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "uploadthing-py",
    "uvicorn>=0.40.0",
]

[tool.uv.sources]
uploadthing-py = { git = "https://github.com/DevDeepakBhattarai/uploadthing-py.git" }

[tool.ruff.lint]
extend-select = ["B"]



[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.14.10",
]
