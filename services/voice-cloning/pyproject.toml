[project]
name = "voice-cloning-service"
version = "0.1.0"
description = "Voice cloning FastAPI service used by manga-reader."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "gradio>=5.46.1",
    "huggingface_hub>=0.35.0",
    "numpy>=2.3.3",
    "pydub>=0.25.1",
    "python-multipart>=0.0.20",
    "qwen-tts==0.1.1",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "transformers>=4.56.2",
    "uvicorn>=0.35.0",
]

[tool.uv]
package = false
